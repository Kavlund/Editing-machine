<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__BRAND_NAME__ · Upgrading</title>
<link rel="icon" href="__BRAND_LOGO__">
<style>
  :root{--bg:#0c0d11;--panel:#14161d;--ink:#eceae4;--muted:#9a978e;--line:#242730;--gold:#c8994a}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(120% 90% at 50% 0%, #16181f 0%, var(--bg) 60%);
    color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:28px;line-height:1.6}
  .card{max-width:560px;width:100%;background:var(--panel);border:1px solid var(--line);
    border-radius:18px;padding:clamp(28px,6vw,48px);text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .logo{height:44px;width:auto;margin:0 auto 18px;display:block;opacity:.95}
  .brand{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:22px}
  h1{font-size:clamp(24px,5vw,34px);line-height:1.12;letter-spacing:-.02em;margin:0 0 12px;font-weight:800;text-wrap:balance}
  p{color:var(--muted);margin:.5em 0;font-size:16px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);
    margin-right:9px;vertical-align:middle;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}
  .status{margin-top:24px;font-size:13px;color:var(--muted);font-family:ui-monospace,"SF Mono",Menlo,monospace;
    letter-spacing:.04em}
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="__BRAND_LOGO__" alt="__BRAND_NAME__">
    <div class="brand">__BRAND_NAME__</div>
    <h1>We are rebuilding the editor</h1>
    <p>The video editor is offline for a short while as we rebuild it into something noticeably better: smoother videos, a cleaner cut, and a true live preview.</p>
    <p>Your finished videos and everything in Drive are safe and untouched.</p>
    <div class="status"><span class="dot"></span>Upgrade in progress</div>
  </main>
</body>
</html>
